<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UMKM Liquidity Risk Classifier · STI ITB 2025</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
/* ============================================================
   UMKM Liquidity Risk Classifier — Design System
   ============================================================ */

:root {
  /* Palette */
  --hr: #E74C3C;
  --hr-bg: #FDEAEA;
  --safe: #27AE60;
  --safe-bg: #EAFAF1;
  --warn: #F39C12;
  --warn-bg: #FEF5E7;
  --primary: #2C3E50;
  --accent: #3498DB;
  --macro: #E67E22;
  --temporal: #3498DB;
  --gold: #F1C40F;

  /* Neutrals */
  --ink: #1B2733;
  --ink-2: #34495E;
  --ink-3: #5D6D7E;
  --ink-4: #95A5A6;
  --line: #ECF0F1;
  --line-2: #E5E9EC;
  --surface: #FFFFFF;
  --canvas: #F4F6F8;
  --sidebar: #FAFBFC;

  /* Type */
  --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-mono: 'JetBrains Mono', 'Menlo', monospace;

  /* Radii */
  --r-sm: 6px;
  --r-md: 10px;
  --r-lg: 14px;
  --r-xl: 20px;

  /* Shadow */
  --sh-1: 0 1px 2px rgba(16, 24, 40, 0.04), 0 1px 3px rgba(16, 24, 40, 0.06);
  --sh-2: 0 2px 8px rgba(16, 24, 40, 0.06), 0 4px 16px rgba(16, 24, 40, 0.04);
  --sh-3: 0 8px 24px rgba(16, 24, 40, 0.08), 0 2px 6px rgba(16, 24, 40, 0.04);
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  font-family: var(--font);
  background: var(--canvas);
  color: var(--ink);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

#root { min-height: 100vh; }

/* ===== Layout shell ===== */
.app {
  display: grid;
  grid-template-columns: 280px 1fr;
  min-height: 100vh;
}

/* ===== Sidebar ===== */
.sidebar {
  background: var(--sidebar);
  border-right: 1px solid var(--line);
  padding: 20px 18px;
  display: flex;
  flex-direction: column;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
}

.sidebar-brand {
  display: flex;
  align-items: center;
  gap: 10px;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--line);
  margin-bottom: 16px;
}

.brand-mark {
  width: 36px;
  height: 36px;
  border-radius: 8px;
  background: linear-gradient(135deg, var(--primary), var(--accent));
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  font-weight: 700;
  font-size: 16px;
}

.brand-text { display: flex; flex-direction: column; line-height: 1.2; }
.brand-name { font-weight: 700; font-size: 13.5px; color: var(--ink); }
.brand-sub { font-size: 11px; color: var(--ink-4); }

.sidebar-section-label {
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink-4);
  margin: 8px 4px 6px;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 11px;
  border-radius: 8px;
  cursor: pointer;
  color: var(--ink-2);
  font-size: 13px;
  font-weight: 500;
  transition: background .15s, color .15s;
  user-select: none;
}
.nav-item:hover { background: rgba(52, 152, 219, 0.06); color: var(--ink); }
.nav-item.active {
  background: var(--primary);
  color: white;
}
.nav-item.active .nav-icon { color: white; }
.nav-icon {
  width: 18px; height: 18px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: var(--ink-3);
  font-size: 15px;
}

.sidebar-divider {
  height: 1px;
  background: var(--line);
  margin: 14px 0;
}

.model-status {
  background: white;
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  padding: 10px 12px;
  font-size: 12px;
}
.model-status-title {
  font-weight: 600;
  color: var(--ink);
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.model-status-row {
  display: flex;
  align-items: center;
  gap: 6px;
  color: var(--ink-3);
  padding: 3px 0;
  font-size: 11.5px;
}
.dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--safe);
  flex-shrink: 0;
}
.dot.err { background: var(--hr); }
.dot.warn { background: var(--warn); }

.sidebar-footer {
  margin-top: auto;
  padding-top: 16px;
  border-top: 1px solid var(--line);
  font-size: 11px;
  color: var(--ink-4);
  line-height: 1.5;
}
.sidebar-footer strong { color: var(--ink-3); font-weight: 600; }

/* ===== Content area ===== */
.content {
  padding: 28px 36px 64px;
  max-width: 1400px;
  width: 100%;
}

.page-header { margin-bottom: 24px; }
.page-eyebrow {
  font-size: 11.5px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--accent);
  font-weight: 600;
  margin-bottom: 6px;
}
.page-title {
  font-size: 26px;
  font-weight: 700;
  letter-spacing: -0.01em;
  color: var(--ink);
  margin: 0 0 4px;
}
.page-sub {
  color: var(--ink-3);
  font-size: 14px;
  margin: 0;
}

/* ===== Cards ===== */
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  padding: 20px;
  box-shadow: var(--sh-1);
}
.card.tight { padding: 16px; }
.card.flush { padding: 0; overflow: hidden; }

.card-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--ink);
  margin: 0 0 4px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.card-sub {
  font-size: 12.5px;
  color: var(--ink-3);
  margin: 0 0 14px;
}

/* ===== Metric ===== */
.metric {
  background: white;
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  padding: 18px 20px;
  position: relative;
  overflow: hidden;
}
.metric .accent-bar {
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 4px;
  background: var(--primary);
}
.metric.hr .accent-bar { background: var(--hr); }
.metric.safe .accent-bar { background: var(--safe); }
.metric.warn .accent-bar { background: var(--warn); }

.metric-label {
  font-size: 12px;
  font-weight: 500;
  color: var(--ink-3);
  letter-spacing: 0.02em;
  margin-bottom: 6px;
}
.metric-value {
  font-size: 30px;
  font-weight: 700;
  color: var(--ink);
  letter-spacing: -0.02em;
  line-height: 1.1;
  font-variant-numeric: tabular-nums;
}
.metric-delta {
  font-size: 12px;
  margin-top: 6px;
  color: var(--ink-3);
  display: flex;
  align-items: center;
  gap: 4px;
}
.metric-delta.up { color: var(--safe); }
.metric-delta.down { color: var(--hr); }
.metric-delta.warn { color: var(--warn); }

/* ===== Badge ===== */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 3px 10px;
  border-radius: 20px;
  font-size: 11.5px;
  font-weight: 600;
  letter-spacing: 0.01em;
}
.badge-risk { background: var(--hr-bg); color: var(--hr); }
.badge-safe { background: var(--safe-bg); color: var(--safe); }
.badge-warn { background: var(--warn-bg); color: var(--warn); }
.badge-neutral { background: var(--line); color: var(--ink-2); }
.badge .dotmark { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

/* ===== Buttons ===== */
.btn {
  font-family: inherit;
  font-size: 13px;
  font-weight: 600;
  border-radius: 8px;
  padding: 9px 16px;
  border: 1px solid transparent;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: background .15s, transform .05s, box-shadow .15s;
  white-space: nowrap;
}
.btn:active { transform: translateY(1px); }
.btn-primary {
  background: var(--primary);
  color: white;
}
.btn-primary:hover { background: #1F2D3D; }
.btn-primary:disabled { background: var(--ink-4); cursor: not-allowed; }
.btn-accent {
  background: var(--accent);
  color: white;
}
.btn-accent:hover { background: #2580BE; }
.btn-ghost {
  background: transparent;
  color: var(--ink-2);
  border-color: var(--line-2);
}
.btn-ghost:hover { background: var(--canvas); }
.btn-block { width: 100%; justify-content: center; padding: 11px 16px; font-size: 13.5px; }

/* ===== Inputs ===== */
.field-label {
  font-size: 12.5px;
  font-weight: 600;
  color: var(--ink);
  margin-bottom: 6px;
  display: block;
}
.field-hint {
  font-size: 11.5px;
  color: var(--ink-4);
  margin-top: 4px;
}
.input, .select {
  width: 100%;
  font-family: inherit;
  font-size: 13px;
  padding: 9px 11px;
  border: 1px solid var(--line-2);
  border-radius: 8px;
  background: white;
  color: var(--ink);
  outline: none;
  transition: border-color .15s, box-shadow .15s;
}
.input:focus, .select:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.12);
}

/* ===== Radio cards ===== */
.radio-group { display: flex; flex-direction: column; gap: 8px; }
.radio-card {
  border: 1.5px solid var(--line-2);
  border-radius: 10px;
  padding: 11px 13px;
  cursor: pointer;
  background: white;
  transition: border-color .15s, background .15s;
  display: flex;
  align-items: center;
  gap: 10px;
}
.radio-card:hover { border-color: var(--accent); }
.radio-card.selected {
  border-color: var(--accent);
  background: rgba(52, 152, 219, 0.05);
}
.radio-dot {
  width: 16px; height: 16px;
  border-radius: 50%;
  border: 1.5px solid var(--line-2);
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
}
.radio-card.selected .radio-dot { border-color: var(--accent); }
.radio-card.selected .radio-dot::after {
  content: '';
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--accent);
}
.radio-title { font-weight: 600; font-size: 13px; color: var(--ink); }
.radio-caption { font-size: 11.5px; color: var(--ink-3); margin-top: 1px; }
.radio-body { flex: 1; }

/* ===== File dropzone ===== */
.dropzone {
  border: 1.5px dashed var(--line-2);
  border-radius: 10px;
  padding: 22px 16px;
  text-align: center;
  background: var(--canvas);
  cursor: pointer;
  transition: border-color .15s, background .15s;
}
.dropzone:hover { border-color: var(--accent); background: rgba(52, 152, 219, 0.04); }
.dropzone.has-file {
  border-style: solid;
  border-color: var(--safe);
  background: var(--safe-bg);
}
.dropzone.has-error {
  border-color: var(--hr);
  background: var(--hr-bg);
}
.dropzone.drag-over {
  border-color: var(--accent);
  border-style: solid;
  background: rgba(52, 152, 219, 0.10);
  transform: scale(1.005);
}
.btn-link-danger {
  background: transparent;
  border: none;
  color: var(--hr);
  font-size: 11.5px;
  font-weight: 600;
  cursor: pointer;
  padding: 2px 4px;
  text-decoration: underline;
  font-family: inherit;
}
.btn-link-danger:hover { color: #B03A2E; }
.dropzone-icon {
  font-size: 24px;
  color: var(--ink-4);
  margin-bottom: 6px;
}
.dropzone.has-file .dropzone-icon { color: var(--safe); }
.dropzone-title { font-weight: 600; font-size: 13px; color: var(--ink); }
.dropzone-hint { font-size: 11.5px; color: var(--ink-3); margin-top: 3px; }

/* ===== Tabs ===== */
.tabs {
  display: flex;
  gap: 0;
  border-bottom: 1px solid var(--line);
  margin-bottom: 18px;
}
.tab {
  padding: 9px 16px;
  font-size: 13px;
  font-weight: 500;
  color: var(--ink-3);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
  transition: color .15s, border-color .15s;
}
.tab:hover { color: var(--ink); }
.tab.active {
  color: var(--accent);
  border-bottom-color: var(--accent);
  font-weight: 600;
}

/* ===== Slider ===== */
.slider-wrap { padding: 4px 0 8px; }
.slider-track-wrap { position: relative; height: 28px; display: flex; align-items: center; }
.slider {
  appearance: none;
  -webkit-appearance: none;
  width: 100%;
  height: 4px;
  background: var(--line);
  border-radius: 2px;
  outline: none;
}
.slider::-webkit-slider-thumb {
  appearance: none;
  -webkit-appearance: none;
  width: 18px; height: 18px;
  border-radius: 50%;
  background: var(--accent);
  cursor: pointer;
  border: 3px solid white;
  box-shadow: 0 1px 4px rgba(0,0,0,0.2);
}
.slider::-moz-range-thumb {
  width: 18px; height: 18px;
  border-radius: 50%;
  background: var(--accent);
  cursor: pointer;
  border: 3px solid white;
  box-shadow: 0 1px 4px rgba(0,0,0,0.2);
}
.slider-marks {
  display: flex;
  justify-content: space-between;
  font-size: 10.5px;
  color: var(--ink-4);
  font-variant-numeric: tabular-nums;
  margin-top: 4px;
}
.slider-value {
  font-family: var(--font-mono);
  font-weight: 600;
  color: var(--accent);
  font-size: 14px;
}

/* ===== Table ===== */
.table-wrap {
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  overflow: hidden;
  background: white;
}
table.data {
  width: 100%;
  border-collapse: collapse;
  font-size: 12.5px;
}
table.data thead th {
  text-align: left;
  font-weight: 600;
  font-size: 11px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--ink-3);
  background: var(--canvas);
  padding: 10px 14px;
  border-bottom: 1px solid var(--line);
  white-space: nowrap;
}
table.data tbody td {
  padding: 10px 14px;
  border-bottom: 1px solid var(--line);
  vertical-align: middle;
  color: var(--ink);
}
table.data tbody tr:last-child td { border-bottom: none; }
table.data tbody tr.row-hr { background: var(--hr-bg); }
table.data tbody tr.row-safe { background: var(--safe-bg); }
table.data tbody tr:hover { filter: brightness(0.985); }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

/* Inline progress bar inside table */
.prog {
  display: flex; align-items: center; gap: 8px;
}
.prog-track {
  flex: 1;
  background: var(--line);
  height: 6px;
  border-radius: 3px;
  position: relative;
  overflow: hidden;
  min-width: 80px;
  max-width: 140px;
}
.prog-fill {
  height: 100%;
  border-radius: 3px;
  background: var(--accent);
}
.prog-fill.risk { background: var(--hr); }
.prog-fill.safe { background: var(--safe); }
.prog-label {
  font-family: var(--font-mono);
  font-size: 11.5px;
  font-variant-numeric: tabular-nums;
  color: var(--ink-2);
  font-weight: 600;
  min-width: 38px;
  text-align: right;
}

/* ===== Alert ===== */
.alert {
  border-radius: var(--r-md);
  padding: 12px 14px;
  font-size: 12.5px;
  display: flex;
  align-items: flex-start;
  gap: 10px;
  border: 1px solid;
  line-height: 1.5;
}
.alert-info { background: rgba(52, 152, 219, 0.07); border-color: rgba(52, 152, 219, 0.25); color: #1B4F72; }
.alert-warn { background: var(--warn-bg); border-color: rgba(243, 156, 18, 0.3); color: #7E5109; }
.alert-error { background: var(--hr-bg); border-color: rgba(231, 76, 60, 0.3); color: #922B21; }
.alert-success { background: var(--safe-bg); border-color: rgba(39, 174, 96, 0.3); color: #196F3D; }
.alert-icon { font-size: 16px; line-height: 1; flex-shrink: 0; margin-top: 1px; }
.alert-title { font-weight: 700; margin-bottom: 2px; }

/* ===== Grids ===== */
.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.grid-input { display: grid; grid-template-columns: 360px 1fr; gap: 24px; }
.grid-detail { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

/* Landing nav cards */
.nav-card-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
.nav-card {
  background: white;
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  padding: 22px;
  cursor: pointer;
  transition: border-color .2s, box-shadow .2s, transform .1s;
  position: relative;
  overflow: hidden;
}
.nav-card:hover {
  border-color: var(--accent);
  box-shadow: var(--sh-2);
  transform: translateY(-1px);
}
.nav-card-icon {
  width: 42px; height: 42px;
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px;
  background: rgba(52, 152, 219, 0.1);
  color: var(--accent);
  margin-bottom: 14px;
}
.nav-card-title { font-size: 16px; font-weight: 700; color: var(--ink); margin: 0 0 4px; }
.nav-card-desc { font-size: 12.5px; color: var(--ink-3); margin: 0; line-height: 1.55; }
.nav-card-cta {
  font-size: 12px; color: var(--accent); font-weight: 600;
  margin-top: 12px; display: inline-flex; align-items: center; gap: 4px;
}

/* Pipeline progress */
.pipeline {
  display: flex;
  flex-direction: column;
  gap: 8px;
  font-size: 12.5px;
}
.pipeline-row {
  display: flex; align-items: center; gap: 12px;
}
.pipeline-bar {
  flex: 1;
  height: 6px;
  background: var(--line);
  border-radius: 3px;
  overflow: hidden;
}
.pipeline-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent), var(--primary));
  transition: width .35s ease;
}
.pipeline-label {
  min-width: 200px;
  color: var(--ink-2);
}
.pipeline-status { font-size: 11.5px; color: var(--ink-4); min-width: 60px; text-align: right; }
.pipeline-status.done { color: var(--safe); }

/* CLR chart placeholder text */
.chart-empty {
  height: 280px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: repeating-linear-gradient(
    135deg, transparent, transparent 10px,
    rgba(0,0,0,0.02) 10px, rgba(0,0,0,0.02) 20px
  );
  border-radius: 10px;
  color: var(--ink-4);
  font-family: var(--font-mono);
  font-size: 12px;
}

/* Disclaimer footer */
.disclaimer {
  margin-top: 32px;
  padding: 14px 16px;
  background: white;
  border: 1px dashed var(--line-2);
  border-radius: 8px;
  font-size: 11.5px;
  color: var(--ink-3);
  line-height: 1.6;
}
.disclaimer strong { color: var(--ink-2); }

/* Detail header */
.detail-header {
  display: grid;
  grid-template-columns: 1.2fr 0.8fr 1fr 1fr;
  gap: 0;
  background: white;
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  overflow: hidden;
}
.detail-header > div {
  padding: 18px 22px;
  border-right: 1px solid var(--line);
}
.detail-header > div:last-child { border-right: none; }
.detail-label {
  font-size: 11px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--ink-4);
  font-weight: 600;
  margin-bottom: 6px;
}
.detail-value-lg { font-size: 22px; font-weight: 700; color: var(--ink); letter-spacing: -0.01em; }
.detail-id-name { display: flex; flex-direction: column; gap: 2px; }
.detail-id-name .small { font-size: 12px; color: var(--ink-3); font-weight: 500; }

.gauge-mini {
  width: 110px; height: 60px;
  position: relative;
  margin: 0 auto;
}

/* Feature value table */
.feat-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 12px;
}
.feat-table th {
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--ink-4);
  text-align: left;
  padding: 8px 10px;
  border-bottom: 1px solid var(--line);
}
.feat-table td {
  padding: 7px 10px;
  border-bottom: 1px solid var(--line);
}
.feat-table tr:last-child td { border-bottom: none; }
.feat-table .extreme { background: rgba(243, 156, 18, 0.08); }
.feat-bar {
  height: 5px;
  background: var(--line);
  border-radius: 2px;
  overflow: hidden;
  min-width: 60px;

    // simple seeded random

    const arr = [];
    for (let i = 0; i < weeks; i++) {
      const v = baseline + trend * i + (rand() - 0.5) * noise;

    { id: "UMKM_010", nama: "Catering Sehat",          sektor: "F&B",          prob: 0.18, clrSeries: genCLR(110, 1.3, 0.01, 0.14) },

    u.slope4 = +(ms / 5).toFixed(3);
    u.tren = u.slope4 > 0.02 ? "up" : u.slope4 < -0.02 ? "down" : "flat";
    u.weekLast = "2025-02-24";
  });

  // Feature definitions used in detail page (top features for H=4 Stacking)
  const topFeaturesH4 = [
    { name: "clr_lag1",         imp: 0.182, group: "lag" },

    { name: "macro_bi_rate_lag1",imp:0.039, group: "makro" },

  // Per-UMKM feature values (generated relative to the UMKM's profile)
  function featureValuesFor(umkm, hz) {

    const recent = umkm.clrSeries.slice(-4);

      { name: "clr_roll12_mean",   value: +(mean4 + 0.05).toFixed(3), group: "roll", extreme: false },
      { name: "clr_delta4",        value: +(last - umkm.clrSeries[umkm.clrSeries.length - 5]).toFixed(3), group: "tren", extreme: false },
      { name: "macro_inflasi_lag1",value: 0.0273, group: "makro", extreme: false },

      { name: "macro_bi_rate_lag1",value: 0.0600, group: "makro", extreme: false },

  }

  // Model performance tables (Section 4, hardcoded)
  const trackA = {
    4: {
      'Extra Trees': { MacroF1: 0.5689, F1_HR: 0.6723, Prec_HR: 0.6234, Rec_HR: 0.7512, AUC: 0.78 },

      'LightGBM':    { MacroF1: 0.5778, F1_HR: 0.6812, Prec_HR: 0.6289, Rec_HR: 0.7589, AUC: 0.79 },
      'Stacking':    { MacroF1: 0.5912, F1_HR: 0.7156, Prec_HR: 0.6489, Rec_HR: 0.7734, AUC: 0.83 },
    },
    12: {
      'Extra Trees': { MacroF1: 0.5421, F1_HR: 0.6512, Prec_HR: 0.6011, Rec_HR: 0.7234, AUC: 0.76 },
      'XGBoost':     { MacroF1: 0.5567, F1_HR: 0.6701, Prec_HR: 0.6178, Rec_HR: 0.7401, AUC: 0.78 },
      'LightGBM':    { MacroF1: 0.5489, F1_HR: 0.6634, Prec_HR: 0.6123, Rec_HR: 0.7345, AUC: 0.77 },
      'Stacking':    { MacroF1: 0.5612, F1_HR: 0.6789, Prec_HR: 0.6234, Rec_HR: 0.7456, AUC: 0.80 },
    },
    24: {
      'Extra Trees': { MacroF1: 0.5189, F1_HR: 0.6234, Prec_HR: 0.5734, Rec_HR: 0.6912, AUC: 0.73 },

  const trackB = {

      'SoftVoting':  { F1_HR: 0.7456, Prec_HR: 0.7234, Rec_HR: 0.7689, AUC: 0.88, MacroF1: 0.7345 },
    },
    12: {
      'Extra Trees': { F1_HR: 0.7034, Prec_HR: 0.6856, Rec_HR: 0.7223, AUC: 0.83, MacroF1: 0.6956 },
      'XGBoost':     { F1_HR: 0.7189, Prec_HR: 0.6989, Rec_HR: 0.7401, AUC: 0.85, MacroF1: 0.7102 },
      'LightGBM':    { F1_HR: 0.7123, Prec_HR: 0.6923, Rec_HR: 0.7334, AUC: 0.84, MacroF1: 0.7045 },
      'SoftVoting':  { F1_HR: 0.7245, Prec_HR: 0.7045, Rec_HR: 0.7456, AUC: 0.86, MacroF1: 0.7167 },
    },
    24: {
      'Extra Trees': { F1_HR: 0.6612, Prec_HR: 0.6423, Rec_HR: 0.6812, AUC: 0.80, MacroF1: 0.6534 },
      'XGBoost':     { F1_HR: 0.6745, Prec_HR: 0.6534, Rec_HR: 0.6967, AUC: 0.82, MacroF1: 0.6678 },
      'LightGBM':    { F1_HR: 0.6789, Prec_HR: 0.6578, Rec_HR: 0.7012, AUC: 0.82, MacroF1: 0.6712 },

  const bestTrackBPerH = { 4: 'SoftVoting', 12: 'SoftVoting', 24: 'LightGBM' };
  const bestTrackAPerH = { 4: 'Stacking', 12: 'Stacking', 24: 'Stacking' };

  const macroAblation = [

  <script type="text/babel" data-presets="react">
// Page 1: Input Data & Prediksi — Wizard 4 langkah
// Alur yang dipakai pengguna UMKM:
//   1. Data Usaha       — identitas + upload sales.csv + expense.csv (+ data contoh + template)
//   2. Rentang Prediksi — 1 / 3 / 6 bulan ke depan
//   3. Cara Menampilkan — 2 atau 3 tingkat (threshold slider hanya untuk 2 tingkat).
//                         Data ekonomi nasional OTOMATIS terintegrasi, bukan opsi.
//   4. Konfirmasi       — ringkasan + jalankan prediksi

const SECTORS = ['Retail', 'Makanan & Minuman', 'Manufaktur / Konveksi', 'Jasa', 'Lainnya'];

// ----- CSV utilities -----
const parseCSV = (text) => {
  const clean = text.replace(/^\uFEFF/, '').trim();
  if (!clean) return { error: 'File CSV kosong.' };
  const lines = clean.split(/\r?\n/).filter(l => l.length > 0);
  if (lines.length < 2) return { error: 'CSV harus berisi header + minimal 1 baris data.' };
  const headers = lines[0].split(',').map(h => h.trim().toLowerCase().replace(/^"|"$/g, ''));
  const rows = [];
  for (let i = 1; i < lines.length; i++) {
    const cells = lines[i].split(',').map(c => c.trim().replace(/^"|"$/g, ''));
    const obj = {};
    headers.forEach((h, j) => { obj[h] = cells[j] !== undefined ? cells[j] : ''; });
    rows.push(obj);
  }
  return { headers, rows };
};

const triggerDownload = (filename, csvText) => {
  const blob = new Blob([csvText], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
};

const buildTemplate = (kind) => {
  const col = kind === 'sales' ? 'sub_total' : 'total';
  const lines = [`date,${col}`];
  const today = new Date();
  for (let i = 139; i >= 0; i--) {
    const d = new Date(today.getTime() - i * 86400000);
    if (d.getDay() === 0) continue;
    const ds = d.toISOString().slice(0, 10);
    const base = kind === 'sales' ? 1_250_000 : 850_000;
    const wave = Math.round(Math.sin(i * 0.18) * (kind === 'sales' ? 400_000 : 250_000));
    const weekly = Math.round(Math.sin(i * 0.9) * (kind === 'sales' ? 180_000 : 100_000));
    lines.push(`${ds},${base + wave + weekly}`);
  }
  return lines.join('\n') + '\n';
};

const validateCsv = (parsed, kind) => {
  if (parsed.error) return { error: parsed.error };
  const valueCol = kind === 'sales' ? 'sub_total' : 'total';
  const need = ['date', valueCol];
  const missing = need.filter(c => !parsed.headers.includes(c));
  if (missing.length) {
    return { error: `Kolom wajib hilang: ${missing.map(c => `"${c}"`).join(', ')}. Ditemukan: ${parsed.headers.join(', ') || '—'}` };
  }
  if (parsed.headers.includes('customer_id')) {
    return { error: 'Format lama terdeteksi (kolom "customer_id"). Pada versi ini, 1 file = 1 UMKM. Hapus kolom customer_id.' };
  }
  const cleanRows = [];
  let badDates = 0, badValues = 0;
  for (const r of parsed.rows) {
    const ds = r.date;
    const v = parseFloat(String(r[valueCol]).replace(/[,_\s]/g, ''));
    const ts = Date.parse(ds);
    if (isNaN(ts)) { badDates++; continue; }
    if (!isFinite(v)) { badValues++; continue; }
    cleanRows.push({ date: ds, ts, value: v });
  }
  if (!cleanRows.length) return { error: 'Tidak ada baris valid setelah parsing tanggal & nilai.' };
  cleanRows.sort((a, b) => a.ts - b.ts);
  const tsMin = cleanRows[0].ts;
  const tsMax = cleanRows[cleanRows.length - 1].ts;
  const dayspan = (tsMax - tsMin) / 86400000;
  const weeks = Math.max(1, Math.floor(dayspan / 7) + 1);
  const total = cleanRows.reduce((s, r) => s + r.value, 0);
  return {
    rows: cleanRows.length, badDates, badValues, weeks,
    minDate: new Date(tsMin).toISOString().slice(0, 10),
    maxDate: new Date(tsMax).toISOString().slice(0, 10),
    total, preview: cleanRows.slice(0, 5), valueCol,
  };
};

const MIN_WEEKS = { 4: 12, 12: 20, 24: 32 };

// Human labels for horizons
const HORIZON_LABELS = {
  4:  { headline: '1 bulan ke depan', sub: '4 minggu',  caption: 'Paling akurat · perencanaan jangka pendek' },
  12: { headline: '3 bulan ke depan', sub: '12 minggu', caption: 'Akurasi menengah · perencanaan kuartalan' },
  24: { headline: '6 bulan ke depan', sub: '24 minggu', caption: 'Jangka panjang · perencanaan strategis' },
};

// =========================================================================
const InputPage = ({ setPage, thresholds, horizonStats, onPredict, predictionDone }) => {
  // Step state
  const [step, setStep] = React.useState(1);

  // Step 1: identitas + files
  const [umkmId, setUmkmId] = React.useState('');
  const [umkmName, setUmkmName] = React.useState('');
  const [umkmSector, setUmkmSector] = React.useState('Retail');
  const [tab, setTab] = React.useState('upload');
  const [salesData, setSalesData] = React.useState(null);
  const [expenseData, setExpenseData] = React.useState(null);
  const [salesError, setSalesError] = React.useState(null);
  const [expenseError, setExpenseError] = React.useState(null);

  // Step 2: horizon
  const [horizon, setHorizon] = React.useState(4);

  // Step 3: mode
  const [mode, setMode] = React.useState('3'); // '2' = dua tingkat, '3' = tiga tingkat
  const [tau, setTau] = React.useState(thresholds[4]);

  // Step 4: running
  const [running, setRunning] = React.useState(false);
  const [pipelineStep, setPipelineStep] = React.useState(0);

  const salesInputRef = React.useRef(null);
  const expenseInputRef = React.useRef(null);

  // When horizon changes, sync default tau
  React.useEffect(() => { setTau(thresholds[horizon]); }, [horizon, thresholds]);

  // ---- File handling ----
  const handleFile = (kind, file) => {
    if (!file) return;
    if (!/\.csv$/i.test(file.name)) {
      const err = `File harus berekstensi .csv (dapat: ${file.name})`;
      if (kind === 'sales') { setSalesError(err); setSalesData(null); }
      else { setExpenseError(err); setExpenseData(null); }
      return;
    }
    const reader = new FileReader();
    reader.onload = (ev) => {
      const txt = String(ev.target.result || '');
      const parsed = parseCSV(txt);
      const result = validateCsv(parsed, kind);
      if (result.error) {
        if (kind === 'sales') { setSalesError(result.error); setSalesData(null); }
        else { setExpenseError(result.error); setExpenseData(null); }
        return;
      }
      const data = { name: file.name, size: file.size, ...result };
      if (kind === 'sales') { setSalesData(data); setSalesError(null); }
      else { setExpenseData(data); setExpenseError(null); }
    };
    reader.onerror = () => {
      const err = 'Gagal membaca file. Coba lagi.';
      if (kind === 'sales') setSalesError(err); else setExpenseError(err);
    };
    reader.readAsText(file);
  };

  const onDrop = (kind) => (e) => {
    e.preventDefault();
    e.currentTarget.classList.remove('drag-over');
    const f = e.dataTransfer.files && e.dataTransfer.files[0];
    if (f) handleFile(kind, f);
  };
  const onDragOver = (e) => { e.preventDefault(); e.currentTarget.classList.add('drag-over'); };
  const onDragLeave = (e) => { e.currentTarget.classList.remove('drag-over'); };

  const removeFile = (kind) => {
    if (kind === 'sales') { setSalesData(null); setSalesError(null); if (salesInputRef.current) salesInputRef.current.value = ''; }
    else { setExpenseData(null); setExpenseError(null); if (expenseInputRef.current) expenseInputRef.current.value = ''; }
  };

  const loadDemoFiles = () => {
    const fakeFile = (name, text) => {
      const blob = new Blob([text], { type: 'text/csv' });
      return new File([blob], name, { type: 'text/csv' });
    };
    const sales = fakeFile('contoh_penjualan.csv', buildTemplate('sales'));
    const expense = fakeFile('contoh_pengeluaran.csv', buildTemplate('expense'));
    handleFile('sales', sales);
    handleFile('expense', expense);
    if (!umkmId) setUmkmId('UMKM_DEMO_01');
    if (!umkmName) setUmkmName('Toko Demo Mandiri');
  };

  // ---- Validation ----
  const identityFilled = umkmId.trim() && umkmName.trim();
  const haveFiles = salesData && expenseData;
  const minWeeks = MIN_WEEKS[horizon];
  const enoughHistory = haveFiles && Math.min(salesData.weeks, expenseData.weeks) >= minWeeks;
  const datesOverlap = haveFiles && salesData.minDate && expenseData.minDate
    ? !(salesData.maxDate < expenseData.minDate || expenseData.maxDate < salesData.minDate)
    : true;

  const step1Issues = [];
  if (!identityFilled) step1Issues.push('Lengkapi nama & ID usaha Anda');
  if (!salesData) step1Issues.push('Unggah data penjualan');
  if (!expenseData) step1Issues.push('Unggah data pengeluaran');
  if (haveFiles && !datesOverlap) step1Issues.push('Rentang tanggal penjualan & pengeluaran tidak overlap');

  // Step 1 OK if identity + files + overlap; "enoughHistory" depends on horizon so we check at step 4.
  const step1Ready = step1Issues.length === 0;
  const horizonHistoryOK = !haveFiles || enoughHistory;

  // ---- Pipeline ----
  const pipelineSteps = [
    `Membaca data ${umkmName || umkmId || 'usaha Anda'}`,
    'Mengelompokkan transaksi per minggu',
    'Menghitung rasio arus kas (pemasukan ÷ pengeluaran)',
    'Menggabungkan dengan data ekonomi nasional',
    'Menjalankan model & menyusun laporan',
  ];

  const buildWeeklyCLR = () => {
    const weeks = Math.min(salesData.weeks, expenseData.weeks);
    const meanIn = salesData.total / weeks;
    const meanOut = expenseData.total / weeks;
    const baseCLR = meanOut > 0 ? meanIn / meanOut : 1;
    let s = 0;
    for (let i = 0; i < (umkmId || 'X').length; i++) s += (umkmId || 'X').charCodeAt(i);
    const rand = () => { s = (s * 9301 + 49297) % 233280; return s / 233280; };
    const series = [];
    let drift = 0;
    for (let w = 0; w < weeks; w++) {
      drift += (rand() - 0.5) * 0.04;
      const noise = (rand() - 0.5) * 0.25;
      series.push(Math.max(0.1, +(baseCLR * (1 + drift) + noise).toFixed(3)));
    }
    return { series, baseCLR };
  };

  const runPipeline = () => {
    setRunning(true);
    setPipelineStep(0);
    let i = 0;
    const tick = () => {
      i++;
      setPipelineStep(i);
      if (i < pipelineSteps.length) {
        setTimeout(tick, 480);
      } else {
        setTimeout(() => {
          const { series } = buildWeeklyCLR();
          const last = series[series.length - 1];
          const last4 = series.slice(-4);
          const mean = last4.reduce((a, b) => a + b, 0) / last4.length;
          const ms = [0, 1, 2, 3].reduce((acc, j) => acc + (j - 1.5) * (last4[j] - mean), 0);
          const slope4 = +(ms / 5).toFixed(3);
          const tren = slope4 > 0.02 ? 'up' : slope4 < -0.02 ? 'down' : 'flat';
          const q25 = 0.82;
          let prob = 0.5
            + 0.45 * Math.max(0, (q25 - last) / q25)
            - 0.30 * Math.max(0, last - 1.4)
            - 1.5 * slope4;
          prob = Math.max(0.03, Math.min(0.97, prob));

          const submittedUMKM = {
            id: umkmId.trim(),
            nama: umkmName.trim(),
            sektor: umkmSector,
            prob: +prob.toFixed(3),
            clrSeries: series,
            clrLast: last,
            slope4, tren,
            weekLast: salesData.maxDate,
            weeks: Math.min(salesData.weeks, expenseData.weeks),
            dateRange: `${salesData.minDate} → ${salesData.maxDate}`,
            totalInflow: salesData.total,
            totalOutflow: expenseData.total,
            salesFileName: salesData.name,
            expenseFileName: expenseData.name,
            submittedAt: new Date().toISOString(),
          };
          onPredict({ horizon, tau, mode, submittedUMKM });
          setRunning(false);
        }, 350);
      }
    };
    setTimeout(tick, 420);
  };

  // ===== Stepper definition =====
  const stepDefs = [
    { n: 1, label: 'Data Usaha',         hint: 'Identitas & riwayat transaksi' },
    { n: 2, label: 'Rentang Prediksi',   hint: 'Mau lihat berapa lama ke depan?' },
    { n: 3, label: 'Cara Tampilan',      hint: 'Tingkat detail hasil prediksi' },
    { n: 4, label: 'Konfirmasi',         hint: 'Periksa & jalankan' },
  ];

  const goNext = () => setStep(s => Math.min(4, s + 1));
  const goBack = () => setStep(s => Math.max(1, s - 1));

  return (
    <div className="content">
      <div className="page-header">
        <div className="page-eyebrow">Halaman 1 dari 4</div>
        <h1 className="page-title">Mulai Prediksi Arus Kas Usaha Anda</h1>
        <p className="page-sub">
          Empat langkah singkat. Kami akan memandu Anda dari unggah data sampai laporan prediksi.
        </p>
      </div>

      <Stepper steps={stepDefs} current={step} onJump={(n) => {
        // Allow jumping backwards freely; forward jumps only to steps already validly reachable.
        if (n < step) setStep(n);
        else if (n === step) {/* noop */}
        else if (n === 2 && step1Ready) setStep(2);
        else if (n === 3 && step1Ready) setStep(3);
        else if (n === 4 && step1Ready) setStep(4);
      }} />

      {step === 1 && (
        <Step1Data
          umkmId={umkmId} setUmkmId={setUmkmId}
          umkmName={umkmName} setUmkmName={setUmkmName}
          umkmSector={umkmSector} setUmkmSector={setUmkmSector}
          tab={tab} setTab={setTab}
          salesData={salesData} expenseData={expenseData}
          salesError={salesError} expenseError={expenseError}
          salesInputRef={salesInputRef} expenseInputRef={expenseInputRef}
          handleFile={handleFile} onDrop={onDrop}
          onDragOver={onDragOver} onDragLeave={onDragLeave}
          removeFile={removeFile} loadDemoFiles={loadDemoFiles}
          datesOverlap={datesOverlap}
        />
      )}

      {step === 2 && (
        <Step2Horizon
          horizon={horizon} setHorizon={setHorizon}
          horizonStats={horizonStats}
          haveFiles={haveFiles} salesData={salesData} expenseData={expenseData}
          enoughHistory={enoughHistory} minWeeks={minWeeks}
        />
      )}

      {step === 3 && (
        <Step3Mode
          mode={mode} setMode={setMode}
          tau={tau} setTau={setTau}
          horizon={horizon} thresholds={thresholds}
        />
      )}

      {step === 4 && (
        <Step4Confirm
          umkmId={umkmId} umkmName={umkmName} umkmSector={umkmSector}
          salesData={salesData} expenseData={expenseData}
          horizon={horizon} mode={mode} tau={tau}
          horizonStats={horizonStats}
          horizonHistoryOK={horizonHistoryOK} minWeeks={minWeeks}
          running={running} pipelineStep={pipelineStep} pipelineSteps={pipelineSteps}
          runPipeline={runPipeline}
          predictionDone={predictionDone}
          setPage={setPage}
          goBack={goBack}
        />
      )}

      {/* Nav buttons (except on step 4 — handled inline there) */}
      {step < 4 && (
        <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginTop: 18}}>
          <button
            className="btn btn-ghost"
            onClick={goBack}
            disabled={step === 1}
            style={step === 1 ? {visibility: 'hidden'} : {}}
          >← Kembali</button>
          <div style={{fontSize: 12, color: 'var(--ink-4)'}}>
            Langkah {step} dari 4
          </div>
          <button
            className="btn btn-primary"
            onClick={goNext}
            disabled={step === 1 && !step1Ready}
          >
            Lanjutkan →
          </button>
        </div>
      )}

      <div className="disclaimer">
        <strong>⚠️ Catatan:</strong> Prototipe Tugas Akhir STI ITB 2025. Prediksi tidak dapat
        digunakan sebagai dasar keputusan bisnis nyata tanpa validasi lebih lanjut.
      </div>
    </div>
  );
};

// Stepper bar
const Stepper = ({ steps, current, onJump }) => (
  <div style={{
    background: 'white', border: '1px solid var(--line)', borderRadius: 'var(--r-lg)',
    padding: '16px 8px', marginBottom: 18, display: 'grid',
    gridTemplateColumns: `repeat(${steps.length}, 1fr)`, gap: 0, position: 'relative',
  }}>
    {steps.map((s, i) => {
      const done = s.n < current;
      const active = s.n === current;
      return (
        <div
          key={s.n}
          onClick={() => onJump(s.n)}
          style={{
            cursor: 'pointer', padding: '4px 12px', display: 'flex',
            alignItems: 'center', gap: 10, position: 'relative', minWidth: 0,
          }}
        >
          {i > 0 && (
            <div style={{
              position: 'absolute', left: 0, top: '50%',
              width: '50%', height: 2,
              background: done || active ? 'var(--accent)' : 'var(--line)',

            }}/>

          <div style={{
            width: 28, height: 28, borderRadius: '50%',
            background: done ? 'var(--accent)' : active ? 'white' : 'var(--canvas)',

            fontSize: 12, fontWeight: 700, flexShrink: 0, zIndex: 1, position: 'relative',
            transition: 'all .2s',
          }}>
            {done ? '✓' : s.n}
          </div>
          <div style={{minWidth: 0}}>
            <div style={{
              fontSize: 13, fontWeight: active ? 700 : 600,
              color: active ? 'var(--ink)' : done ? 'var(--ink-2)' : 'var(--ink-4)',
              lineHeight: 1.2, textOverflow: 'ellipsis', overflow: 'hidden', whiteSpace: 'nowrap',

    })}

// ----- helpers -----
const formatBytes = (b) => {
  if (b < 1024) return `${b} B`;
  if (b < 1024 * 1024) return `${(b / 1024).toFixed(1)} KB`;
  return `${(b / 1024 / 1024).toFixed(2)} MB`;
};

const formatShort = (n) => {
  if (n >= 1e9) return `${(n / 1e9).toFixed(2)} Mlr`;
  if (n >= 1e6) return `${(n / 1e6).toFixed(2)} Jt`;
  if (n >= 1e3) return `${(n / 1e3).toFixed(1)} Rb`;
  return String(Math.round(n));
};

          </div>

        </div>

          padding: '12px 20px 18px', borderTop: '1px dashed var(--line)',
          display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 14,
        }}>
          <PeerStat
            label="Total usaha pembanding"
            value={peerList.length}
            hint="Riwayat anonim"
          />
          <PeerStat
            label="Yang termasuk berisiko"
            value={`${peerHR} dari ${peerList.length}`}
            hint={`${Math.round(peerHR / peerList.length * 100)}% dari total`}
            tone="hr"
          />
          <PeerStat
            label="Skor Anda lebih tinggi dari"
            value={`${Math.round((peerList.filter(p => p.prob < u.prob).length / peerList.length) * 100)}%`}
            hint="usaha lain dalam sebaran"
            tone={u.prob >= tau ? 'hr' : 'safe'}
          />
        </div>
      </div>

      <div className="disclaimer">
        <strong>⚠️ Catatan:</strong> Laporan ini bersifat indikatif dan dimaksudkan untuk membantu pengambilan
        keputusan, bukan menggantikannya. Konsultasikan dengan penasihat keuangan untuk keputusan besar.
      </div>
    </div>
  );
};

  <script type="text/babel" data-presets="react">
// Analisis Mendalam — detail usaha untuk pemilik UMKM (bahasa awam, tanpa feature importance)

  const isHR = umkm.prob >= tau;

  // Friendly labels for last reading

  const trendColor = umkm.tren === 'up' ? 'var(--safe)' : umkm.tren === 'down' ? 'var(--hr)' : 'var(--ink-3)';

  // Plain-language "factors" — what nudged the prediction
  const recent = umkm.clrSeries.slice(-4);
  const mean4 = recent.reduce((a, b) => a + b, 0) / recent.length;
  const factors = [];
  // Cash health
  if (umkm.clrLast < qs.q25) {
    factors.push({
      icon: '🔴', tone: 'hr',
      title: 'Rasio arus kas terakhir di bawah batas waspada',
      detail: `Minggu terakhir, untuk setiap Rp 1 yang keluar hanya Rp ${umkm.clrLast.toFixed(2)} yang masuk. Idealnya di atas Rp ${qs.q75.toFixed(2)}.`,
    });
  } else if (umkm.clrLast > qs.q75) {
    factors.push({
      icon: '🟢', tone: 'safe',
      title: 'Rasio arus kas terakhir sehat',
      detail: `Minggu terakhir, untuk setiap Rp 1 yang keluar ada Rp ${umkm.clrLast.toFixed(2)} yang masuk — di atas batas aman.`,
    });
  } else {
    factors.push({
      icon: '🟡', tone: 'warn',
      title: 'Rasio arus kas berada di zona sedang',
      detail: `Tidak terlalu tipis, tetapi juga belum benar-benar sehat (Rp ${umkm.clrLast.toFixed(2)} masuk per Rp 1 keluar). Pantau terus.`,
    });
  }
  // Trend
  if (umkm.tren === 'down') {
    factors.push({
      icon: '📉', tone: 'hr',
      title: 'Tren menurun dalam 4 minggu terakhir',
      detail: 'Rasio arus kas Anda terus berkurang sedikit demi sedikit. Pola seperti ini berisiko menjadi defisit bila tidak ditangani.',
    });
  } else if (umkm.tren === 'up') {
    factors.push({
      icon: '📈', tone: 'safe',
      title: 'Tren membaik dalam 4 minggu terakhir',
      detail: 'Rasio arus kas Anda terus naik — pertanda usaha sedang menguat.',
    });
  } else {
    factors.push({
      icon: '➡️', tone: 'neutral',
      title: 'Pergerakan stabil dalam 4 minggu terakhir',
      detail: 'Tidak ada perubahan besar pada rasio arus kas Anda. Sistem melihat ini sebagai kondisi yang tidak banyak bergejolak.',
    });
  }
  // 4-week average vs caution band
  if (mean4 < qs.q25 * 1.2) {
    factors.push({
      icon: '⚠️', tone: 'warn',
      title: 'Rata-rata 4 minggu dekat dengan zona waspada',
      detail: `Rata-rata rasio Anda selama bulan terakhir (Rp ${mean4.toFixed(2)}) mendekati batas yang sebaiknya tidak dilewati.`,
    });
  }
  // Macro context — always mention
  factors.push({
    icon: '🌐', tone: 'neutral',
    title: 'Kondisi ekonomi nasional sudah diperhitungkan',
    detail: 'Sistem juga melihat inflasi, suku bunga BI, dan nilai tukar rupiah saat ini — semua itu otomatis ikut menentukan prediksi.',
  });

  // ===== Time-series chart =====
  React.useEffect(() => {
    if (!tsRef.current) return;
    const weeks = umkm.clrSeries.map((_, i) => i + 1);
    const predWeek = weeks[weeks.length - 1] + horizon;

    Plotly.react(tsRef.current, [
      // Background bands (HR, Moderate, Safe)
      { type: 'scatter', x: [weeks[0], predWeek], y: [qs.q25, qs.q25], mode: 'lines',
        line: { color: 'rgba(0,0,0,0)' }, fill: 'tozeroy', fillcolor: 'rgba(231, 76, 60, 0.08)',
        showlegend: false, hoverinfo: 'skip' },
      { type: 'scatter', x: [weeks[0], predWeek], y: [qs.q75, qs.q75], mode: 'lines',
        line: { color: 'rgba(0,0,0,0)' }, fill: 'tonexty', fillcolor: 'rgba(243, 156, 18, 0.07)',
        showlegend: false, hoverinfo: 'skip' },
      { type: 'scatter', x: [weeks[0], predWeek], y: [3.5, 3.5], mode: 'lines',
        line: { color: 'rgba(0,0,0,0)' }, fill: 'tonexty', fillcolor: 'rgba(39, 174, 96, 0.07)',
        showlegend: false, hoverinfo: 'skip' },
      // Threshold lines
      { type: 'scatter', x: [weeks[0], predWeek], y: [qs.q25, qs.q25], mode: 'lines',
        name: 'Batas waspada',
        line: { color: '#E74C3C', width: 1.5, dash: 'dash' }, hoverinfo: 'skip' },
      { type: 'scatter', x: [weeks[0], predWeek], y: [qs.q75, qs.q75], mode: 'lines',
        name: 'Batas aman',
        line: { color: '#27AE60', width: 1.5, dash: 'dash' }, hoverinfo: 'skip' },
      // Actual line
      { type: 'scatter', x: weeks, y: umkm.clrSeries, mode: 'lines+markers',
        name: 'Catatan Anda',
        line: { color: '#2C3E50', width: 2.5 },
        marker: { size: 6, color: '#2C3E50' },
        hovertemplate: 'Minggu ke-%{x}<br>Rasio kas: <b>%{y:.2f}</b><extra></extra>',
      },
      // Prediction marker
      { type: 'scatter', x: [predWeek], y: [umkm.clrSeries[umkm.clrSeries.length - 1]], mode: 'markers',
        name: `Prediksi ${horizonLabel}`,
        marker: { size: 16, color: isHR ? '#E74C3C' : '#27AE60', symbol: 'diamond',
                  line: { color: 'white', width: 2 } },
        hovertemplate: `Prediksi ${horizonLabel}: <b>${isHR ? 'BERISIKO' : 'AMAN'}</b><br>Skor: ${(umkm.prob*100).toFixed(0)}%<extra></extra>`,
      },
    ], {
      template: 'plotly_white',
      xaxis: { title: { text: 'Minggu ke-', font: { size: 11, color: '#5D6D7E' } }, gridcolor: '#ECF0F1' },
      yaxis: { title: { text: 'Rasio uang masuk ÷ keluar', font: { size: 11, color: '#5D6D7E' } },
               gridcolor: '#ECF0F1', range: [0, 3.5] },
      legend: { orientation: 'h', y: 1.12, font: { family: 'Inter', size: 11 } },
      margin: { l: 60, r: 30, t: 30, b: 40 },
      height: 340,
      font: { family: 'Inter' },
      shapes: [{
        type: 'rect', x0: weeks[weeks.length - 1], x1: predWeek, y0: 0, y1: 3.5,
        line: { width: 0 }, fillcolor: 'rgba(52, 152, 219, 0.04)', layer: 'below',
      }],
      annotations: [{
        x: predWeek, y: umkm.clrSeries[umkm.clrSeries.length - 1] + 0.4, xref: 'x', yref: 'y',
        text: `<b>${horizonLabel} ke depan</b><br>${isHR ? 'Berisiko' : 'Aman'} · ${(umkm.prob*100).toFixed(0)}%`,
        showarrow: true, arrowhead: 0, ax: -10, ay: -30,
        font: { color: isHR ? '#E74C3C' : '#27AE60', size: 11, family: 'Inter' },
        bgcolor: 'white', bordercolor: isHR ? '#E74C3C' : '#27AE60', borderwidth: 1, borderpad: 4,
      }],
      paper_bgcolor: 'rgba(0,0,0,0)',
      plot_bgcolor: 'rgba(0,0,0,0)',
    }, { displayModeBar: false, responsive: true });
  }, [umkm, horizon, tau, isHR, qs, horizonLabel]);

  // ===== Gauge =====
  React.useEffect(() => {
    if (!gaugeRef.current) return;
    Plotly.react(gaugeRef.current, [{
      type: 'indicator', mode: 'gauge+number',
      value: umkm.prob * 100,
      number: { suffix: '%', valueformat: '.0f', font: { size: 24, family: 'Inter', color: '#2C3E50' } },
      gauge: {
        axis: { range: [0, 100], tickwidth: 0, tickvals: [0, 50, 100],
                ticktext: ['Aman', '', 'Berisiko'], tickfont: { size: 9 } },
        bar: { color: isHR ? '#E74C3C' : '#27AE60', thickness: 0.28 },
        bgcolor: 'white', borderwidth: 1, bordercolor: '#ECF0F1',
        steps: [
          { range: [0, 30], color: 'rgba(39, 174, 96, 0.15)' },
          { range: [30, 60], color: 'rgba(243, 156, 18, 0.18)' },
          { range: [60, 100], color: 'rgba(231, 76, 60, 0.18)' },
        ],
      },
    }], {
      height: 140, margin: { l: 18, r: 18, t: 10, b: 5 },
      font: { family: 'Inter' }, paper_bgcolor: 'rgba(0,0,0,0)',
    }, { displayModeBar: false, responsive: true });
  }, [umkm, isHR]);

  return (
    <div className="content">
      <div className="page-header">
        <div className="page-eyebrow">Analisis Mendalam · {horizonLabel} ke depan</div>
        <h1 className="page-title">{umkm.nama}</h1>
        <p className="page-sub">Telusuri faktor-faktor yang mempengaruhi prediksi usaha Anda.</p>
      </div>

      <div style={{display: 'flex', gap: 10, alignItems: 'center', marginBottom: 18, flexWrap: 'wrap'}}>
        <label className="field-label" style={{margin: 0, minWidth: 100}}>Pilih usaha:</label>
        <select className="select" value={umkm.id} onChange={(e) => setSelectedUMKM(e.target.value)} style={{maxWidth: 420}}>
          {umkmList.map(u => (
            <option key={u.id} value={u.id}>
              {u.nama} — {u.prob >= tau ? `Berisiko (${(u.prob*100).toFixed(0)}%)` : `Aman (${(u.prob*100).toFixed(0)}%)`}
            </option>
          ))}
        </select>
        <button className="btn btn-ghost" onClick={() => setPage('hasil')}>← Kembali ke Laporan</button>
      </div>

      {/* Profile header */}
      <div className="detail-header" style={{marginBottom: 18}}>
        <div>
          <div className="detail-label">Usaha</div>
          <div className="detail-id-name">
            <div className="detail-value-lg" style={{fontSize: 18, lineHeight: 1.25}}>{umkm.nama}</div>

        </div>
        <div>
          <div className="detail-label">Status Prediksi</div>
          <div style={{marginTop: 8}}>
            <span className={`badge ${isHR ? 'badge-risk' : 'badge-safe'}`} style={{fontSize: 13, padding: '5px 14px'}}>
              <span className="dotmark"></span>
              {isHR ? 'BERISIKO' : 'AMAN'}
            </span>
          </div>
          <div style={{fontSize: 11.5, color: 'var(--ink-3)', marginTop: 8}}>
            Untuk {horizonLabel} ke depan
          </div>

        <div>

      <div className="card" style={{marginBottom: 18}}>

      {/* Faktor yang mempengaruhi prediksi */}

        <div className="card-title">🧭 Faktor yang Mempengaruhi Prediksi</div>

          {factors.map((f, i) => (
            <FactorRow key={i} f={f} />

      {/* Interpretasi narasi */}
      <div className="card" style={{marginBottom: 18}}>
        <div className="card-title">📝 Ringkasan dalam Bahasa Sehari-hari</div>
        {isHR ? (
          <div className="alert alert-error" style={{marginTop: 12}}>
            <span className="alert-icon">⚠️</span>
            <div>
              <div className="alert-title">Sistem melihat tanda-tanda risiko</div>
              Berdasarkan pola transaksi <strong>{umkm.nama}</strong> selama {umkm.weeks} minggu terakhir,
              sistem memperkirakan ada kemungkinan <strong>{(umkm.prob*100).toFixed(0)}%</strong> usaha Anda
              akan mengalami kesulitan arus kas dalam <strong>{horizonLabel} ke depan</strong>.
              Pola seperti ini pernah ditemui pada usaha-usaha yang kemudian benar-benar kesulitan.
              Lihat saran tindakan di halaman <strong>Laporan Saya</strong>.
            </div>
          </div>
        ) : (
          <div className="alert alert-success" style={{marginTop: 12}}>
            <span className="alert-icon">✅</span>
            <div>
              <div className="alert-title">Sistem tidak melihat tanda risiko</div>
              Berdasarkan pola transaksi <strong>{umkm.nama}</strong> selama {umkm.weeks} minggu terakhir,
              sistem hanya melihat <strong>{(umkm.prob*100).toFixed(0)}%</strong> kemungkinan masalah dalam
              <strong> {horizonLabel} ke depan</strong>. Rasio arus kas Anda{' '}
              {umkm.clrLast > qs.q75 ? 'berada di zona aman' : 'cukup memadai'} dan trennya{' '}
              {umkm.tren === 'up' ? 'membaik' : umkm.tren === 'flat' ? 'stabil' : 'sedikit menurun tetapi belum mengkhawatirkan'}.
            </div>
          </div>
        )}

        <div style={{marginTop: 14, padding: 14, background: 'var(--canvas)', borderRadius: 8, fontSize: 12, color: 'var(--ink-3)', lineHeight: 1.65}}>
          <strong style={{color: 'var(--ink-2)'}}>Cara membaca:</strong> Prediksi ini adalah perkiraan berdasarkan
          pola data Anda dibandingkan ribuan usaha lain. Bukan jaminan, tapi sinyal untuk membantu Anda
          mengambil keputusan lebih cepat. Tetap gunakan akal sehat dan konsultasi dengan orang yang
          memahami keuangan usaha Anda untuk keputusan besar.
        </div>
      </div>

      <div className="disclaimer">
        <strong>⚠️ Catatan:</strong> Analisis ini bersifat indikatif. Sistem tidak menggantikan
        keputusan manusia — gunakan sebagai pendukung, bukan satu-satunya sumber.
      </div>
    </div>
  );
};

// Plain-language factor row
const FactorRow = ({ f }) => {
  const toneColor = { hr: 'var(--hr)', safe: 'var(--safe)', warn: 'var(--warn)', neutral: 'var(--ink-3)' }[f.tone];
  const toneBg   = { hr: 'var(--hr-bg)', safe: 'var(--safe-bg)', warn: 'var(--warn-bg)', neutral: 'var(--canvas)' }[f.tone];
  return (
    <div style={{
      display: 'flex', gap: 14, alignItems: 'flex-start',
      padding: '14px 16px',
      background: toneBg,
      border: `1px solid ${f.tone === 'neutral' ? 'var(--line)' : toneColor + '40'}`,
      borderRadius: 'var(--r-md)',
    }}>
      <div style={{fontSize: 22, lineHeight: 1, flexShrink: 0}}>{f.icon}</div>
      <div style={{flex: 1, minWidth: 0}}>
        <div style={{fontSize: 13, fontWeight: 700, color: 'var(--ink)', marginBottom: 4}}>
          {f.title}

        <div style={{fontSize: 12.5, color: 'var(--ink-2)', lineHeight: 1.6}}>
          {f.detail}
        </div>
      </div>
    </div>
  );
};

          fontSize: 11, fontWeight: 700,

      <div style={{display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 14, marginBottom: 12}}>
        {accuracyCards.map(c => (

            background: 'white', border: '1px solid var(--line)',

            <div style={{

              background: c.tone === 'safe' ? 'var(--safe)' : 'var(--warn)',

            <div style={{fontSize: 12, fontWeight: 600, color: 'var(--ink-3)', letterSpacing: '0.04em', textTransform: 'uppercase'}}>
              Prediksi {c.label}
            </div>
            <div style={{
              fontSize: 42, fontWeight: 700, color: 'var(--ink)',
              letterSpacing: '-0.02em', lineHeight: 1.1, marginTop: 6,
              fontVariantNumeric: 'tabular-nums',
            }}>
              {c.accuracy}<span style={{fontSize: 20, color: 'var(--ink-3)'}}>%</span>

            <div style={{
              fontSize: 12, fontWeight: 600, marginTop: 4,
              color: c.tone === 'safe' ? 'var(--safe)' : 'var(--warn)',

            <div style={{fontSize: 12, color: 'var(--ink-3)', marginTop: 8, lineHeight: 1.5}}>
              {c.note}

      <div className="alert alert-info" style={{marginBottom: 28}}>

          <div className="alert-title">Apa artinya angka ini?</div>
          Jika dikatakan akurasi <strong>73%</strong>, artinya dari 100 usaha yang diprediksi sistem,
          kurang lebih 73 sesuai dengan kenyataannya. Tidak ada sistem yang 100% — gunakan prediksi
          sebagai pendukung, bukan satu-satunya alat.
        </div>

      {/* Why trust it */}
      <h2 style={{
        fontSize: 16, fontWeight: 700, color: 'var(--ink)',
        margin: '8px 0 14px', display: 'flex', alignItems: 'center', gap: 8,
      }}>
        <span style={{

      <div style={{display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 14, marginBottom: 28}}>
        {trustItems.map((t, i) => (
          <div key={i} style={{
            background: 'white', border: '1px solid var(--line)',
            borderRadius: 'var(--r-lg)', padding: '18px 20px',

            <div style={{fontSize: 14, fontWeight: 700, color: 'var(--ink)', marginBottom: 6}}>
              {t.title}
            </div>
            <div style={{fontSize: 12.5, color: 'var(--ink-3)', lineHeight: 1.6}}>
              {t.desc}
            </div>
          </div>

      {/* Limitations */}
      <h2 style={{

        margin: '8px 0 14px', display: 'flex', alignItems: 'center', gap: 8,

        <span style={{
          width: 22, height: 22, background: 'var(--primary)', color: 'white',

// ============================================================
// Technical detail (collapsed by default) — original benchmark content
// ============================================================
const TechDetail = ({ trackA, trackB, bestTrackAPerH, bestTrackBPerH, macroAblation, macroCorr }) => {
  const [tab, setTab] = React.useState('compare');
  const [horizon, setHorizon] = React.useState(4);
  return (
    <div style={{paddingTop: 14}}>
      <div className="tabs">
        <div className={`tab ${tab === 'compare' ? 'active' : ''}`} onClick={() => setTab('compare')}>1. Perbandingan Antar-Model</div>
        <div className={`tab ${tab === 'track' ? 'active' : ''}`} onClick={() => setTab('track')}>2. Track A vs Track B</div>
        <div className={`tab ${tab === 'macro' ? 'active' : ''}`} onClick={() => setTab('macro')}>3. Studi Ablasi Makro</div>
      </div>
      {tab === 'compare' && <CompareTab trackA={trackA} trackB={trackB} bestTrackAPerH={bestTrackAPerH} bestTrackBPerH={bestTrackBPerH} horizon={horizon} setHorizon={setHorizon} />}
      {tab === 'track' && <TrackTab trackA={trackA} trackB={trackB} horizon={horizon} setHorizon={setHorizon} />}
      {tab === 'macro' && <MacroTab macroAblation={macroAblation} macroCorr={macroCorr} />}
    </div>
  );
};

// ───── Tab 1: Compare models ─────
const CompareTab = ({ trackA, trackB, bestTrackAPerH, bestTrackBPerH, horizon, setHorizon }) => {
  const chartARef = React.useRef(null);
  const chartBRef = React.useRef(null);

  const modelsA = ['Extra Trees', 'XGBoost', 'LightGBM', 'Stacking'];
  const modelsB = ['Extra Trees', 'XGBoost', 'LightGBM', 'SoftVoting'];
  const metrics = ['MacroF1', 'F1_HR', 'Prec_HR', 'Rec_HR', 'AUC'];
  const metricLabels = { MacroF1: 'Macro F1', F1_HR: 'F1-HR', Prec_HR: 'Prec-HR', Rec_HR: 'Rec-HR', AUC: 'AUC' };

  const drawGrouped = (ref, data, models, bestModel) => {
    const traces = models.map((m) => ({
      type: 'bar', name: m,
      x: metrics.map(k => metricLabels[k]),
      y: metrics.map(k => data[horizon][m][k]),
      marker: {
        color: m === bestModel ? '#2C3E50' : ['#BDC3C7', '#85929E', '#5D6D7E', '#34495E'][models.indexOf(m)],
        line: m === bestModel ? { color: '#F1C40F', width: 2.5 } : { width: 0 },
      },
      text: metrics.map(k => data[horizon][m][k].toFixed(3)),
      textposition: 'outside',
      textfont: { size: 9, color: '#5D6D7E', family: 'JetBrains Mono' },
    }));

    Plotly.react(ref.current, traces, {
      template: 'plotly_white', barmode: 'group',
      yaxis: { range: [0, 1.0], gridcolor: '#ECF0F1', tickformat: '.2f' },
      xaxis: { tickfont: { size: 11, family: 'Inter' } },
      legend: { orientation: 'h', y: -0.18, font: { family: 'Inter', size: 11 } },
      margin: { l: 50, r: 30, t: 30, b: 60 },
      height: 320, font: { family: 'Inter' },
      paper_bgcolor: 'rgba(0,0,0,0)', plot_bgcolor: 'rgba(0,0,0,0)',
    }, { displayModeBar: false, responsive: true });
  };

  React.useEffect(() => {
    drawGrouped(chartARef, trackA, modelsA, bestTrackAPerH[horizon]);
    drawGrouped(chartBRef, trackB, modelsB, bestTrackBPerH[horizon]);
  }, [horizon]);

  return (
    <div>
      <div style={{display: 'flex', alignItems: 'center', gap: 14, marginBottom: 16}}>
        <span style={{fontSize: 12.5, color: 'var(--ink-3)', fontWeight: 600}}>Horizon:</span>
        {[4, 12, 24].map(h => (
          <div key={h} className={`chip ${horizon === h ? 'active' : ''}`} onClick={() => setHorizon(h)}>H = {h} minggu</div>
        ))}
      </div>

      <div className="grid-2">
        <div className="card">
          <div className="card-title">Track A — Klasifikasi 3-Kelas</div>
          <div className="card-sub">Terbaik H={horizon}: <strong>{bestTrackAPerH[horizon]}</strong></div>
          <div ref={chartARef}></div>
          <div className="table-wrap" style={{marginTop: 14}}>
            <table className="data">
              <thead>
                <tr><th>Model</th>{metrics.map(m => <th key={m} style={{textAlign:'right'}}>{metricLabels[m]}</th>)}</tr>
              </thead>
              <tbody>
                {modelsA.map(m => (
                  <tr key={m} style={m === bestTrackAPerH[horizon] ? { background: 'rgba(241, 196, 15, 0.1)' } : {}}>
                    <td style={{fontWeight: m === bestTrackAPerH[horizon] ? 700 : 500}}>
                      {m === bestTrackAPerH[horizon] && '🏆 '}{m}
                    </td>
                    {metrics.map(k => (
                      <td key={k} className="mono" style={{textAlign: 'right', fontWeight: m === bestTrackAPerH[horizon] ? 700 : 400}}>
                        {trackA[horizon][m][k].toFixed(3)}
                      </td>
                    ))}
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>

        <div className="card">
          <div className="card-title">Track B — Klasifikasi Binary</div>
          <div className="card-sub">Terbaik H={horizon}: <strong>{bestTrackBPerH[horizon]}</strong></div>
          <div ref={chartBRef}></div>
          <div className="table-wrap" style={{marginTop: 14}}>
            <table className="data">
              <thead>
                <tr><th>Model</th>{metrics.map(m => <th key={m} style={{textAlign:'right'}}>{metricLabels[m]}</th>)}</tr>
              </thead>
              <tbody>
                {modelsB.map(m => (
                  <tr key={m} style={m === bestTrackBPerH[horizon] ? { background: 'rgba(241, 196, 15, 0.1)' } : {}}>
                    <td style={{fontWeight: m === bestTrackBPerH[horizon] ? 700 : 500}}>
                      {m === bestTrackBPerH[horizon] && '🏆 '}{m}
                    </td>
                    {metrics.map(k => (
                      <td key={k} className="mono" style={{textAlign: 'right', fontWeight: m === bestTrackBPerH[horizon] ? 700 : 400}}>
                        {trackB[horizon][m][k].toFixed(3)}
                      </td>
                    ))}
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  );
};

// ───── Tab 2: Track A vs Track B ─────
const TrackTab = ({ trackA, trackB, horizon, setHorizon }) => {
  const radarRef = React.useRef(null);
  const a = trackA[horizon].Stacking;
  const b = trackB[horizon][horizon === 24 ? 'LightGBM' : 'SoftVoting'];

  React.useEffect(() => {
    if (!radarRef.current) return;
    const metrics = ['Macro F1', 'F1-HR', 'Prec-HR', 'Rec-HR', 'AUC'];
    const aValues = [a.MacroF1, a.F1_HR, a.Prec_HR, a.Rec_HR, a.AUC];
    const bValues = [b.MacroF1, b.F1_HR, b.Prec_HR, b.Rec_HR, b.AUC];

    Plotly.react(radarRef.current, [
      { type: 'scatterpolar', r: [...aValues, aValues[0]], theta: [...metrics, metrics[0]],
        fill: 'toself', name: 'Track A · Stacking',
        line: { color: '#E74C3C', width: 2 }, fillcolor: 'rgba(231, 76, 60, 0.15)',
        marker: { size: 6 } },
      { type: 'scatterpolar', r: [...bValues, bValues[0]], theta: [...metrics, metrics[0]],
        fill: 'toself', name: `Track B · ${horizon === 24 ? 'LightGBM' : 'SoftVoting'}`,
        line: { color: '#3498DB', width: 2 }, fillcolor: 'rgba(52, 152, 219, 0.18)',
        marker: { size: 6 } },
    ], {
      polar: {
        radialaxis: { visible: true, range: [0.4, 0.9], gridcolor: '#ECF0F1', tickfont: { size: 10 } },
        angularaxis: { tickfont: { size: 11.5, family: 'Inter', color: '#34495E' } },
        bgcolor: 'rgba(0,0,0,0)',
      },
      legend: { orientation: 'h', y: -0.1, font: { family: 'Inter', size: 12 } },
      margin: { l: 50, r: 50, t: 30, b: 60 },
      height: 380, font: { family: 'Inter' },
      paper_bgcolor: 'rgba(0,0,0,0)', plot_bgcolor: 'rgba(0,0,0,0)',
    }, { displayModeBar: false, responsive: true });
  }, [horizon, a, b]);

  const metricRows = [
    { key: 'MacroF1', label: 'Macro F1' },
    { key: 'Rec_HR',  label: 'Recall HIGH_RISK' },
    { key: 'Prec_HR', label: 'Precision HIGH_RISK' },
    { key: 'F1_HR',   label: 'F1 HIGH_RISK' },
    { key: 'AUC',     label: 'ROC AUC' },
  ];

  return (
    <div>
      <div style={{display: 'flex', alignItems: 'center', gap: 14, marginBottom: 16}}>
        <span style={{fontSize: 12.5, color: 'var(--ink-3)', fontWeight: 600}}>Horizon:</span>
        {[4, 12, 24].map(h => (
          <div key={h} className={`chip ${horizon === h ? 'active' : ''}`} onClick={() => setHorizon(h)}>H = {h} minggu</div>
        ))}
      </div>

      <div style={{display: 'grid', gridTemplateColumns: '0.9fr 1.1fr', gap: 16}}>
        <div className="card">
          <div className="card-title">Radar Chart · 5 dimensi metrik</div>
          <div className="card-sub">Visualisasi perbandingan Track A vs Track B pada H={horizon}.</div>
          <div ref={radarRef}></div>
        </div>

        <div className="card">
          <div className="card-title">Selisih Metrik · Track A → Track B</div>
          <div className="card-sub">Persentase poin perbedaan; positif berarti Track B unggul.</div>
          <div style={{display: 'flex', flexDirection: 'column', gap: 10, marginTop: 8}}>
            {metricRows.map(row => {
              const av = a[row.key], bv = b[row.key];
              const delta = (bv - av) * 100;
              return (
                <div key={row.key} style={{display: 'flex', alignItems: 'center', padding: '12px 14px', background: 'var(--canvas)', borderRadius: 10, gap: 14}}>
                  <div style={{flex: 1}}>
                    <div style={{fontSize: 12, color: 'var(--ink-3)', fontWeight: 600}}>{row.label}</div>
                    <div className="mono" style={{fontSize: 14, marginTop: 2}}>
                      <span style={{color: 'var(--hr)'}}>{av.toFixed(3)}</span>
                      &nbsp;→&nbsp;
                      <span style={{color: 'var(--accent)'}}>{bv.toFixed(3)}</span>
                    </div>
                  </div>
                  <div style={{fontFamily: 'JetBrains Mono', fontSize: 18, fontWeight: 700,
                               color: delta > 0 ? 'var(--safe)' : 'var(--hr)'}}>
                    {delta > 0 ? '+' : ''}{delta.toFixed(1)} <span style={{fontSize: 10, color: 'var(--ink-4)'}}>pp</span>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      </div>
    </div>
  );
};

// ───── Tab 3: Macro Ablation ─────
const MacroTab = ({ macroAblation, macroCorr }) => {
  const ablRef = React.useRef(null);

  React.useEffect(() => {
    if (!ablRef.current) return;
    Plotly.react(ablRef.current, [{
      type: 'bar',
      x: macroAblation.map(d => `H = ${d.H}`),
      y: macroAblation.map(d => d.delta),
      marker: { color: macroAblation.map(d => d.H === 12 ? '#27AE60' : '#85C1A2') },
      text: macroAblation.map(d => `+${(d.delta*100).toFixed(2)}%`),
      textposition: 'outside',
      textfont: { size: 12, color: '#196F3D', family: 'JetBrains Mono' },
      width: 0.5,
      hovertemplate: '<b>%{x}</b><br>ΔF1 = %{y:.4f}<extra></extra>',
    }], {
      template: 'plotly_white',
      yaxis: {
        title: { text: 'Δ Macro F1 (full vs no-macro)', font: { size: 11, color: '#5D6D7E' } },
        gridcolor: '#ECF0F1', range: [-0.005, 0.04],
        zeroline: true, zerolinecolor: '#5D6D7E', zerolinewidth: 1.5,
      },
      xaxis: { tickfont: { size: 13, family: 'Inter' } },
      margin: { l: 60, r: 30, t: 30, b: 50 },
      height: 320, font: { family: 'Inter' },
      paper_bgcolor: 'rgba(0,0,0,0)', plot_bgcolor: 'rgba(0,0,0,0)',
    }, { displayModeBar: false, responsive: true });
  }, [macroAblation]);

  return (
    <div>
      <div className="grid-2">
        <div className="card">
          <div className="card-title">ΔMacro F1 · Full Model vs Tanpa Makroekonomi</div>
          <div className="card-sub">Eksperimen dengan menghilangkan 3 fitur makro lag-1 dan 2 fitur interaksi.</div>
          <div ref={ablRef}></div>
        </div>

        <div className="card">
          <div className="card-title">Korelasi Pearson dengan CLR</div>
          <div className="card-sub">Analisis bivariat per variabel makro.</div>
          <div className="table-wrap" style={{marginTop: 12}}>
            <table className="data">
              <thead>
                <tr><th>Variabel</th><th>Pearson r</th><th>p-value</th><th>Interpretasi</th></tr>
              </thead>
              <tbody>
                {macroCorr.map(row => (
                  <tr key={row.v}>
                    <td>{row.v}</td>
                    <td className="mono" style={{color: 'var(--hr)', fontWeight: 600}}>{row.r.toFixed(2)}</td>
                    <td className="mono">{row.p}</td>
                    <td style={{fontSize: 12, color: 'var(--ink-3)'}}>{row.note}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  );
};

window.ResearchPage = ResearchPage;

  </script>
  <script type="text/babel" data-presets="react">
// Root app — handles navigation + global state
const App = () => {
  const [page, setPage] = React.useState('landing');
  const [predictionDone, setPredictionDone] = React.useState(false);
  const [prediction, setPrediction] = React.useState({ horizon: 4, tau: 0.42 });
  const [submittedUMKM, setSubmittedUMKM] = React.useState(null);
  const [selectedUMKM, setSelectedUMKM] = React.useState(null);

  const M = window.MOCK;

  // umkmList = submitted UMKM (if any) prepended to historical peer dataset
  const effectiveList = React.useMemo(() => {
    if (!submittedUMKM) return M.umkmList;
    // Replace if same ID already exists, else prepend
    const without = M.umkmList.filter(u => u.id !== submittedUMKM.id);
    return [submittedUMKM, ...without];
  }, [submittedUMKM, M.umkmList]);

  const handlePredict = ({ horizon, tau, submittedUMKM: u }) => {
    setPrediction({ horizon, tau });
    if (u) {
      setSubmittedUMKM(u);
      setSelectedUMKM(u.id);
    }
    setPredictionDone(true);
  };

  return (
    <div className="app" data-screen-label={`${page}`}>
      <Sidebar
        currentPage={page}
        setPage={setPage}
        thresholds={M.thresholds}
      />
      {page === 'landing' && (
        <LandingPage
          setPage={setPage}
          thresholds={M.thresholds}
          horizonStats={M.horizonStats}
        />
      )}
      {page === 'input' && (
        <InputPage
          setPage={setPage}
          thresholds={M.thresholds}
          horizonStats={M.horizonStats}
          onPredict={handlePredict}
          predictionDone={predictionDone}
        />
      )}
      {page === 'hasil' && (
        <ResultsPage
          setPage={setPage}
          predictionDone={predictionDone}
          prediction={prediction}
          submittedUMKM={submittedUMKM}
          umkmList={effectiveList}
          peerList={M.umkmList}
          thresholds={M.thresholds}
          q25q75={M.q25q75}
          setSelectedUMKM={setSelectedUMKM}
        />
      )}
      {page === 'detail' && (
        <DetailPage
          setPage={setPage}
          predictionDone={predictionDone}
          prediction={prediction}
          submittedUMKM={submittedUMKM}
          umkmList={effectiveList}
          selectedUMKM={selectedUMKM || (submittedUMKM ? submittedUMKM.id : effectiveList[0].id)}
          setSelectedUMKM={setSelectedUMKM}
          topFeaturesH4={M.topFeaturesH4}
          featureValuesFor={M.featureValuesFor}
          q25q75={M.q25q75}
        />
      )}
      {page === 'riset' && (
        <ResearchPage
          trackA={M.trackA}
          trackB={M.trackB}
          bestTrackAPerH={M.bestTrackAPerH}
          bestTrackBPerH={M.bestTrackBPerH}
          macroAblation={M.macroAblation}
          macroCorr={M.macroCorr}
        />
      )}
    </div>
  );
};
